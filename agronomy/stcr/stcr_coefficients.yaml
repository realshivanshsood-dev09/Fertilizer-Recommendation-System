# STCR Coefficients — Punjab / Malwa Region
# =========================================
# Single Source of Truth for live STCR coefficients.
#
# Verified Data Sources:
#   - Wheat: DS-ICAR-PAU-WHEAT-STCR-2022 (Singh, Mavi & Saini 2022, Indian J. Agric. Sci. 92(12): 1502–1505)
#   - Rice: DS-ICAR-PAU-RICE-TYE-INM-2021 (Singh, Mavi & Saini 2021, Indian J. Agric. Sci. 91(10): 1528–1531)
#   - Cotton: Null placeholders awaiting verified PAU/ICAR data.

_metadata:
  schema_version: "2.0.0"
  geographic_scope: "Punjab (Alluvial soils under rice-wheat cropping system)"
  last_updated: "2026-08-19"
  wheat_source: "SRC-ICAR-PAU-WHEAT-STCR-2022"
  rice_source: "SRC-ICAR-PAU-RICE-TYE-INM-2021"
  cotton_source: null
  notes: "Wheat and rice STCR coefficients loaded from verified Track A ICAR/PAU publications."

# Equations: Dose (kg/ha) = max(0, a * T - b * S - (c_residue * RR if residue))
# T = target yield in q/ha
# S = soil test in kg/ha (SN: alkaline KMnO4, SP2O5 / SP: Olsen, SK2O / SK: NH4OAc)

wheat:
  season: rabi
  cultivar: "HD3086"
  soil_type: "Alluvial sandy loam (Typic Ustochrepts)"
  source_id: "SRC-ICAR-PAU-WHEAT-STCR-2022"
  dataset_id: "DS-ICAR-PAU-WHEAT-STCR-2022"
  verification_status: "verified"
  default_target_yield_q_ha: 50.0
  N:
    a: 3.78
    b: 0.96
    c_residue: 0.77
    units:
      a: "kg N / q grain yield"
      b: "dimensionless"
      target_yield: "q/ha"
      soil: "kg/ha (alkaline KMnO4 N)"
      dose: "kg N/ha"
    source: "Singh, Mavi & Saini (2022) Indian J. Agric. Sci. 92(12): 1502–1505"
    verified: true
  P:
    a: 1.54
    b: 0.23
    c_residue: 0.30
    units:
      a: "kg P2O5 / q grain yield"
      b: "dimensionless"
      target_yield: "q/ha"
      soil: "kg/ha (Olsen P2O5)"
      dose: "kg P2O5/ha"
    source: "Singh, Mavi & Saini (2022) Indian J. Agric. Sci. 92(12): 1502–1505"
    verified: true
  K:
    a: 0.95
    b: 0.09
    c_residue: 0.12
    b_with_residue: 0.10
    units:
      a: "kg K2O / q grain yield"
      b: "dimensionless"
      target_yield: "q/ha"
      soil: "kg/ha (NH4OAc K2O)"
      dose: "kg K2O/ha"
    source: "Singh, Mavi & Saini (2022) Indian J. Agric. Sci. 92(12): 1502–1505"
    verified: true

