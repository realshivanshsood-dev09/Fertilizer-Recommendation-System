# Per crop × nutrient coefficients
# Formula: Dose (kg/ha) = (a × T − b × S) / FUE
#   a   = nutrient requirement per Mg target yield (kg nutrient / Mg grain yield)
#   b   = soil test calibration coefficient (dimensionless slope)
#   T   = target yield (Mg/ha)
#   S   = soil test value (kg/ha)
#   FUE = fertilizer use efficiency (fraction, 0–1)

