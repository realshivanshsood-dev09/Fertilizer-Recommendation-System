      dose: "kg N/ha"
    source: "Singh, Mavi & Saini (2021) Indian J. Agric. Sci. 91(10): 1528–1531"
    verified: true
  P:
    a: 1.78
    b: 8.37
    units:
      a: "kg P2O5 / q grain yield"
      b: "dimensionless"
      target_yield: "q/ha"
      soil: "kg/ha (Olsen P)"
      dose: "kg P2O5/ha"
    source: "Singh, Mavi & Saini (2021) Indian J. Agric. Sci. 91(10): 1528–1531"
    verified: true
  K:
