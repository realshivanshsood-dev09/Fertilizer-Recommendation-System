    - "soil_p"
    - "soil_k"
    - "ph"
    - "ec"
    - "organic_carbon"
    - "fertilizer_n"
    - "fertilizer_p2o5"
    - "fertilizer_k2o"
    - "fym_input"
    - "observed_rice_yield"
    - "observed_wheat_yield"
  limitations:
    - "Single experimental site (Gurdaspur, Punjab)"
    - "Typic Ustipsamment sandy loam soil"
    - "PR121 rice / HD3086 wheat rotation"
