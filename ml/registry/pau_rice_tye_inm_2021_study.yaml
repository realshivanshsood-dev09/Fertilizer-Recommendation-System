ml_assessment:
  reason: >
    The published article provides treatment-level pooled means over three consecutive years (2018–2020)
    and three replications, rather than raw individual plot-level observation rows. Synthetic plot records
    must NOT be manufactured.
  validation_value: >
    Contains real field trial response data comparing 100% STCR, INM (with FYM), and sub-optimal doses
    under rice-wheat system. Ideal as an independent benchmark for evaluating whether ML residual
    corrections align with empirical field findings.
  potential_features_when_extracted:
