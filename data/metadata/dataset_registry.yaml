  last_updated: "2026-08-18"
  description: "Master registry of imported datasets and raw files"
  allowed_formats:
    - csv
    - xlsx
    - json
    - pdf_table
    - yaml
  allowed_verification_statuses:
    - unverified
    - under_review
    - verified
    - rejected

