# Location: data/metadata/dataset_registry.yaml
# Single Source of Truth for all physical datasets, files, and tables.
#
# Rules:
# 1. Every dataset must trace to a valid source_id in source_registry.yaml.
# 2. Checksums (SHA-256) are mandatory for raw data integrity verification.
# 3. Raw datasets in data/raw/ must never be modified or overwritten.
# 4. Units and variables must be explicitly declared.
# ==============================================================================

_metadata:
  schema_version: "1.0.0"
  last_updated: "2026-08-18"
  description: "Master registry of imported datasets and raw files"
  allowed_formats:
    - csv
    - xlsx
    - json
    - pdf_table
    - yaml
  allowed_verification_statuses:
    - unverified
    - under_review
    - verified
    - rejected

