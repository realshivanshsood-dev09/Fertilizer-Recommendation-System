_metadata:
  audit_date: "2026-08-19"
  auditor: "SIH 2026 Agronomic ML Validation Team"
  status: "AUDIT_COMPLETE_ML_TRAINING_BLOCKED"
  decision: "DO_NOT_TRAIN_ML"
  rationale: >
    Current empirical corpus consists entirely of treatment-mean aggregates (N=29 rows across 4 studies).
    Zero plot-level or replicate-level rows exist in public peer-reviewed open access tables.
    Supervised gradient boosting or neural networks cannot be trained without severe data leakage
    and empirical over-fitting.

