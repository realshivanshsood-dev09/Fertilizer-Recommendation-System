ml_readiness_verdict:
  status: "NOT_TRAINING_READY"
  suitable_for_training: false
  reason: "ML training blocked by insufficient independent paired response data."
  minimum_data_threshold_for_ml:
    minimum_plot_observations: 150
    minimum_independent_sites: 5
    minimum_unique_fertilizer_regimes: 20
    required_crops: ["wheat", "rice", "cotton"]
    validation_policy: "GroupKFold by study_id / site_id"

ml_target_specification:
  formulation: "Additive Bounded Residual Correction"
  formula:
    Delta_N: "Delta_N = N_optimal - N_STCR"
    Delta_P2O5: "Delta_P2O5 = P_optimal - P_STCR"
    Delta_K2O: "Delta_K2O = K_optimal - K_STCR"
  safety_clipping_bounds: "[-30%, +30%] of deterministic STCR baseline"
  current_status: "DEFERRED_UNTIL_DATA_THRESHOLD_MET"
